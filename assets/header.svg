@keyframes secondLine{0%,20%{clip-path:inset(0 100% 0 0);opacity:1;animation-timing-function:steps(21,end)}33%,94%{clip-path:inset(0);opacity:1}98%,100%{clip-path:inset(0);opacity:0}}
@keyframes thirdLine{0%,35%{clip-path:inset(0 100% 0 0);opacity:1;animation-timing-function:steps(22,end)}48%,94%{clip-path:inset(0);opacity:1}98%,100%{clip-path:inset(0);opacity:0}}
@keyframes caret{0%,5%{transform:translate(0,0);opacity:1}18%{transform:translate(264px,0);opacity:1}19%{transform:translate(264px,0);opacity:0}20%{transform:translate(0,37px);opacity:1}33%{transform:translate(240px,37px);opacity:1}34%{transform:translate(240px,37px);opacity:0}35%{transform:translate(0,74px);opacity:1}48%{transform:translate(252px,74px);opacity:1}52%,100%{transform:translate(252px,74px);opacity:0}}
