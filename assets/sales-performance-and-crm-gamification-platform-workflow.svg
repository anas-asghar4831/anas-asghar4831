<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">From activity to incentives</title><desc id="desc">Conceptual workflow with three stages and two engineering considerations.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#91a5c6" stroke-width="1.4"/></marker></defs><rect width="960" height="570" rx="18" fill="#101522"/><text x="36" y="49" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" fill="#e6edf3">From activity to incentives</text><text x="36" y="81" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#aab8d0">Conceptual system flow</text><rect x="36" y="120" width="276" height="142" rx="12" fill="#192135" stroke="#3c4963"/><rect class="stage stage-0" x="36" y="120" width="276" height="142" rx="12" fill="none" stroke="#7dd3fc" stroke-width="2.5" opacity="0"/><text x="56" y="151" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#7dd3fc">01</text><text x="56" y="189" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#7dd3fc">CRM activity</text><text x="56" y="221" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#c5d2e7">Connect workspace data</text><path d="M316 191H335" stroke="#91a5c6" stroke-width="2" marker-end="url(#arrow)"/><circle class="transfer transfer-0" cx="316" cy="191" r="4" fill="#7dd3fc" opacity="0"/><rect x="342" y="120" width="276" height="142" rx="12" fill="#192135" stroke="#3c4963"/><rect class="stage stage-1" x="342" y="120" width="276" height="142" rx="12" fill="none" stroke="#c4b5fd" stroke-width="2.5" opacity="0"/><text x="362" y="151" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#c4b5fd">02</text><text x="362" y="189" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#c4b5fd">Challenges</text><text x="362" y="221" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#c5d2e7">Track team progress</text><path d="M622 191H641" stroke="#91a5c6" stroke-width="2" marker-end="url(#arrow)"/><circle class="transfer transfer-1" cx="622" cy="191" r="4" fill="#c4b5fd" opacity="0"/><rect x="648" y="120" width="276" height="142" rx="12" fill="#192135" stroke="#3c4963"/><rect class="stage stage-2" x="648" y="120" width="276" height="142" rx="12" fill="none" stroke="#70dbb1" stroke-width="2.5" opacity="0"/><text x="668" y="151" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#70dbb1">03</text><text x="668" y="189" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#70dbb1">Reward review</text><text x="668" y="221" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#c5d2e7">Review redemptions</text><text x="36" y="317" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#e6edf3">Engineering considerations</text><rect x="36" y="339" width="438" height="143" rx="10" fill="#141d2b" stroke="#344158"/><text x="56" y="376" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#7dd3fc">Workspace boundaries</text><text x="56" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#c5d2e7">Keep connection and reward state scoped to</text><text x="56" y="435" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#c5d2e7">the workspace.</text><rect x="486" y="339" width="438" height="143" rx="10" fill="#141d2b" stroke="#344158"/><text x="506" y="376" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#c4b5fd">Subscription state</text><text x="506" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#c5d2e7">Manage billing seats separately from</text><text x="506" y="435" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#c5d2e7">reward approvals.</text><path d="M36 514H924" stroke="#344158"/><text x="36" y="545" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#aab8d0">Illustrative sequence, not live status. Client infrastructure and data omitted.</text><style>
    .stage,.transfer{animation-duration:9s;animation-iteration-count:infinite;animation-timing-function:linear}
    .stage-0{animation-name:stageOne}.stage-1{animation-name:stageTwo}.stage-2{animation-name:stageThree}
    .transfer-0{animation-name:moveOne}.transfer-1{animation-name:moveTwo}
    @keyframes stageOne{0%,4%{opacity:0}8%,23%{opacity:1}29%,100%{opacity:0}}
    @keyframes stageTwo{0%,29%{opacity:0}34%,49%{opacity:1}55%,100%{opacity:0}}
    @keyframes stageThree{0%,55%{opacity:0}60%,80%{opacity:1}87%,100%{opacity:0}}
    @keyframes moveOne{0%,23%{opacity:0;transform:translateX(0)}24%{opacity:1;transform:translateX(0)}32%{opacity:1;transform:translateX(23px)}33%,100%{opacity:0;transform:translateX(23px)}}
    @keyframes moveTwo{0%,49%{opacity:0;transform:translateX(0)}50%{opacity:1;transform:translateX(0)}58%{opacity:1;transform:translateX(23px)}59%,100%{opacity:0;transform:translateX(23px)}}
    @media(prefers-reduced-motion:reduce){.stage,.transfer{animation:none;opacity:0}}
    </style></svg>